version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: pashusetu_db
    restart: always
    environment:
      POSTGRES_USER: pashu_user
      POSTGRES_PASSWORD: pashu_password_secure
      POSTGRES_DB: pashusetu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pashu_user -d pashusetu"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pashusetu_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://pashu_user:pashu_password_secure@db:5432/pashusetu
      SECRET_KEY: pashusetu-super-secret-jwt-key-2026-production-ready
      SEED_DEMO_DATA: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pashusetu_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
